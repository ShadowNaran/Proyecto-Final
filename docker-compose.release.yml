x-api-base: &api-base
  image: ${DOCKER_IMAGE:-abrahdev/proyecto-final:1.0.0}
  pull_policy: always
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
  env_file:
    - path: .env
      required: false
  environment:
    DB_CONNECTION_STRING: Host=db;Port=5432;Database=${POSTGRES_DB:-catalogo_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    DATA_PROTECTION_KEYS_PATH: /app/keys
    CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:5174,http://127.0.0.1:5174,http://localhost:5001,http://localhost:5002,http://localhost:5003,http://localhost:5004}
  volumes:
    - dpkeys_release:/app/keys
  networks:
    - catalogo_release_net

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-catalogo_db}
    volumes:
      - pgdata_release:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-catalogo_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - catalogo_release_net

  api-1:
    <<: *api-base
    ports:
      - "5001:8080"

  api-2:
    <<: *api-base
    ports:
      - "5002:8080"

  api-3:
    <<: *api-base
    ports:
      - "5003:8080"

  api-4:
    <<: *api-base
    ports:
      - "5004:8080"

volumes:
  pgdata_release:
  dpkeys_release:

networks:
  catalogo_release_net:
    driver: bridge
